<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Central .bare database node (bottom) -->
  <rect x="44" y="88" width="40" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="3.5"/>
  <circle cx="54" cy="100" r="3" fill="#38BDF8"/>
  <line x1="62" y1="100" x2="76" y2="100" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

  <!-- Branching paths from .bare to linked worktrees -->
  <path d="M64 88 V66" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 66 C64 52, 28 58, 28 42" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M64 66 V38" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M64 66 C64 52, 100 58, 100 42" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left worktree node (feat-a) -->
  <rect x="14" y="18" width="28" height="24" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="3"/>
  <circle cx="28" cy="30" r="4.5" fill="#34D399"/>

  <!-- Center worktree node (main) -->
  <rect x="50" y="14" width="28" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="3"/>
  <circle cx="64" cy="26" r="4.5" fill="#60A5FA"/>

  <!-- Right worktree node (feat-b) -->
  <rect x="86" y="18" width="28" height="24" rx="5" fill="#831843" stroke="#F472B6" stroke-width="3"/>
  <circle cx="100" cy="30" r="4.5" fill="#F472B6"/>

  <!-- Central junction node -->
  <circle cx="64" cy="66" r="5" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
</svg>
